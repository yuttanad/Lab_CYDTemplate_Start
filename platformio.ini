; =====================================================================
;  Lab_Template_Start  --  ESP32 CYD Dev Level 2 (LVGL)
;  บอร์ด ESP32-2432S028 (CYD) จอ 2.8" 320x240 + จอสัมผัส XPT2046
;
;  โปรเจกต์ตั้งต้นของ Level 2: ตรวจจอ (สี/ทิศ/ข้อความไทย), calibrate จอสัมผัสแบบแม่นยำ,
;  ทดสอบ RGB LED และลำโพง ให้พร้อมก่อนเริ่ม Lab อื่น
;
;  เลือกชิปจอให้ตรงกับบอร์ด (ดู README หัวข้อ 3):
;    env:cyd_ILI9341          จอ ILI9341  (บอร์ด micro-USB รุ่นเดิม)       <- ค่าเริ่มต้น
;    env:cyd_st7789   จอ ST7789   (บอร์ด USB-C / จอ TPM408-2.8)
;  สีกลับ / แดงสลับน้ำเงิน / ภาพกลับด้าน  ไม่ต้องแก้ไฟล์นี้: ปรับได้บนจอที่แท็บ "จอภาพ" (จำค่าถาวร)
; =====================================================================

[platformio]
default_envs = cyd_ILI9341

[common]
platform = espressif32@7.0.1   ; ล็อกเวอร์ชันให้ทุกเครื่องในห้องเรียนได้ผลเหมือนกัน (Arduino core 2.0.17)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv   ; พื้นที่โปรแกรม 3 MB (ฟอนต์ไทยใช้ที่ ~150 KB) แลกกับไม่มี OTA
build_flags_common =
  ; ---- จอ TFT: pin (ต้องตรงกับ include/board_config.h) ----
  -D USER_SETUP_LOADED
  -D USE_HSPI_PORT
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD
  -D DISABLE_ALL_LIBRARY_WARNINGS   ; ปิดคำเตือน TOUCH_CS ของ TFT_eSPI (เราอ่านจอสัมผัสเอง)
  -D SPI_FREQUENCY=55000000        ; ถ้าภาพมีจุดสุ่ม/เส้นขยะ ลดเป็น 40000000
  -D SPI_READ_FREQUENCY=20000000
  ; ---- LVGL: ให้หา lv_conf.h ในโฟลเดอร์ include ----
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -Iinclude
  -std=gnu++17
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  lvgl/lvgl@8.3.11

; ---- จอ ILI9341 (CYD รุ่นเดิม micro-USB) ----
[env:cyd_ILI9341]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_unflags = -std=gnu++11
build_flags =
  ${common.build_flags_common}
  -D ILI9341_DRIVER

; ---- จอ ST7789 (CYD รุ่น USB-C / จอ TPM408-2.8) ----
[env:cyd_st7789]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_unflags = -std=gnu++11
build_flags =
  ${common.build_flags_common}
  -D ST7789_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_RGB_ORDER=0
  -D TFT_INVERSION_OFF
